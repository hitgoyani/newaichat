in"],"cookie_domain":".alumni.charusat.ac.in","cids_allowed":[219,220,221,222,223,224,225,226,227,1215],"https":1,"ssl_status":1},"loggedin_cid":"","same_com_log":false,"isAdmin":false,"license_agreements_link":"https:\/\/agreements.almashines.com","data":{"cid":"219","user_name":"charusat","short_name":"CHARUSAT","com_name":"Charotar University of Science and Technology","name":"Charotar University of Science and Technology","entity_name":"Charotar University of Science and Technology","student_count":"0","alumni_count":"0","description":"<p class=\"inherit-font-size\">\u00a0<\/p>\n\n<p class=\"inherit-font-size\"><strong>Charotar University of Science and Technology (CHARUSAT)<\/strong> has been conceived by <em>Shri Charotar Moti Sattavis Patidar Kelavani Mandal<\/em> to make <strong>Charotar \u2013 the Land of Sardar Patel<\/strong> the <strong>Global Education Hub<\/strong>. Kelavani Mandal is a premier education trust of India. It has an ancestry of social service of more than 125 years old social organization.<\/p>\n\n<p class=\"inherit-font-size\">CHARUSAT has been established under the Gujarat Private University Act No. 8 of 2009. It is empowered to confer degrees under Section 22 of the UGC Act 1956. It is the first State University to get \"A\" Grade in Gujarat in the first cycle by National Assessment and Accreditation Council, NAAC, Bangalore. In the second cycle, CHARUSAT has been accredited with the \u201cA+\u201d Grade. University is recognized as \u201cCentre of Excellence\" on January 4, 2022 by Govt. of Gujarat. CHARUSAT is a member of \"United Nations Academic Impact\" from May 16, 2022. In 2019, CHARUSAT received the Scientific and Industrial Research Organisations (SIROs) recognition by the Department of Scientific and Industrial Research (DSIR), New Delhi. It is the first university in Gujarat to adapt a paperless examination.<\/p>\n\n<p class=\"inherit-font-size\">Presently, CHARUSAT offers more than 70 programs from Undergraduate to Doctoral (PhD) under the tutelage of 9 Institutes, 7 Faculties, 20 Major Centers \/ Cells, employee strength of more than 650, student strength of 10000+, and a Capital Outlay of more than INR 150 Crore. The programs are offered in the allied disciplines of Technology & Engineering, Pharmacy, Computer Applications, Management Studies, Applied Sciences, Nursing, Physiotherapy, and other Paramedical Sciences. Under the <strong>CHARUSAT Center for Online Education (CCOE)<\/strong> university offers Online programs like (Bachelor of Computer Applications - BCA and Bachelor of Business Administration - BBA).<\/p>\n\n<p class=\"inherit-font-size\">All programs are semester based and are delivered in <strong>English. Credit and Grading Systems<\/strong> are followed for Teaching, Learning, and Evaluation. Curriculum and Pedagogy correspond with societal needs. Industrial Visits, Study Tours, Interactive IT-enabled Teaching Practice, Project \/ Case \/ Task-Based Learning, Blended Learning, and Expert Lectures form an integral part of innovative pedagogy at CHARUSAT.<\/p>\n\n<p class=\"inherit-font-size\">The Iron Man of India, Sardar Vallabhbhai Patel, believed \"Education without character is futile\". CHARUSAT proudly follows this spirit. It also follows founding <strong>High Moral Values<\/strong> like Honesty, Integrity, Transparency, Fairness, Equity, and Accountability.<\/p>\n\n<p class=\"inherit-font-size\">As a University, CHARUSAT intends not just to hand a map to those willing to follow it, but to inculcate leadership skills among new generation. Therefore, the thrust, at CHARUSAT, is on socially relevant Innovations and Research. Dedicated research initiatives in these areas are undertaken through establishment of dedicated research centres viz. <strong>Dr. K C Patel Research and Development Centre, CHARUSAT Space Research & Technology Centre, International Centre for Cosmology and Center of Excellence in Artificial Intelligence<\/strong> as well as various sophisticated labs, central instrumentation facilities and NABL-accredited special labs. These initiatives have overall yielded significant impact and deliverables in industry, academic, environment and healthcare sectors.<\/p>\n\n<p class=\"inherit-font-size\">To further accelerate interdisciplinary research activities at CHARUSAT, various initiatives have been taken. As a result, 25+ Patents have been filed and\/or held by the students and faculty members of CHARUSAT. To accelerate applied research activities on campus, Sophisticated Research and Testing Labs have also been established. Distinctively, CHARUSAT has also initiated Post-Doctoral Fellowships, Research Paper Award, Patent and Intellectual Property Policy, Collaborations, and Endowment Chairs, and Seed Grant for Research.<\/p>\n\n<p class=\"inherit-font-size\"><strong>Entrepreneurship Development and Incubation Centre (EDIC)<\/strong> has also been established to address the challenges and explore the opportunities that young aspirants can explore.\u00a0 A non-profit organization called \"<strong>CHARUSAT Innovative Ventures Foundation (CIVF)<\/strong>\" was founded by the university to investigate the commercialization of CHARUSAT's research, innovation, and intellectual property for the benefit of CHARUSAT and society. At CHARUSAT, efforts are also made for education amelioration in rural schools through <strong>CHARUSAT Rural Education Development Program (CREDP)<\/strong>. There also exists <strong>Pri. B I Patel Human Resource Development Centre<\/strong> to hone competencies of Faculty and Staff.<\/p>\n\n<p class=\"inherit-font-size\">Finally, CHARUSAT fosters an aspiration of being a <strong>World Class University<\/strong>. It strives, initially, to be in the league of <strong>Top 20 Universities at National Level<\/strong>. CHARUSAT wishes to achieve it through hybrid culture: A culture representing the serenity of the oldest places of learning like Takshashila and Nalanda and the scholarship of the center ,"cookie_domain":".alumni.charusat.ac.in","cids_allowed":[219,220,221,222,223,224,225,226,227,1215],"https":1,"ssl_status":1},"loggedin_cid":"","same_com_log":false,"isAdmin":false,"license_agreements_link":"https:\/\/agreements.almashines.com","data":{"cid":"219","user_name":"charusat","short_name":"CHARUSAT","com_name":"Charotar University of Science and Technology","name":"Charotar University of Science and Technology","entity_name":"Charotar University of Science and Technology","student_count":"0","alumni_count":"0","description":"<p class=\"inherit-font-size\">\u00a0<\/p>\n\n<p class=\"inherit-font-size\"><strong>Charotar University of Science and Technology (CHARUSAT)<\/strong> has been conceived by <em>Shri Charotar Moti Sattavis Patidar Kelavani Mandal<\/em> to make <strong>Charotar \u2013 the Land of Sardar Patel<\/strong> the <strong>Global Education Hub<\/strong>. Kelavani Mandal is a premier education trust of India. It has an ancestry of social service of more than 125 years old social organization.<\/p>\n\n<p class=\"inherit-font-size\">CHARUSAT has been established under the Gujarat Private University Act No. 8 of 2009. It is empowered to confer degrees under Section 22 of the UGC Act 1956. It is the first State University to get \"A\" Grade in Gujarat in the first cycle by National Assessment and Accreditation Council, NAAC, Bangalore. In the second cycle, CHARUSAT has been accredited with the \u201cA+\u201d Grade. University is recognized as \u201cCentre of Excellence\" on January 4, 2022 by Govt. of Gujarat. CHARUSAT is a member of \"United Nations Academic Impact\" from May 16, 2022. In 2019, CHARUSAT received the Scientific and Industrial Research Organisations (SIROs) recognition by the Department of Scientific and Industrial Research (DSIR), New Delhi. It is the first university in Gujarat to adapt a paperless examination.<\/p>\n\n<p class=\"inherit-font-size\">Presently, CHARUSAT offers more than 70 programs from Undergraduate to Doctoral (PhD) under the tutelage of 9 Institutes, 7 Faculties, 20 Major Centers \/ Cells, employee strength of more than 650, student strength of 10000+, and a Capital Outlay of more than INR 150 Crore. The programs are offered in the allied disciplines of Technology & Engineering, Pharmacy, Computer Applications, Management Studies, Applied Sciences, Nursing, Physiotherapy, and other Paramedical Sciences. Under the <strong>CHARUSAT Center for Online Education (CCOE)<\/strong> university offers Online programs like (Bachelor of Computer Applications - BCA and Bachelor of Business Administration - BBA).<\/p>\n\n<p class=\"inherit-font-size\">All programs are semester based and are delivered in <strong>English. Credit and Grading Systems<\/strong> are followed for Teaching, Learning, and Evaluation. Curriculum and Pedagogy correspond with societal needs. Industrial Visits, Study Tours, Interactive IT-enabled Teaching Practice, Project \/ Case \/ Task-Based Learning, Blended Learning, and Expert Lectures form an integral part of innovative pedagogy at CHARUSAT.<\/p>\n\n<p class=\"inherit-font-size\">The Iron Man of India, Sardar Vallabhbhai Patel, believed \"Education without character is futile\". CHARUSAT proudly follows this spirit. It also follows founding <strong>High Moral Values<\/strong> like Honesty, Integrity, Transparency, Fairness, Equity, and Accountability.<\/p>\n\n<p class=\"inherit-font-size\">As a University, CHARUSAT intends not just to hand a map to those willing to follow it, but to inculcate leadership skills among new generation. Therefore, the thrust, at CHARUSAT, is on socially relevant Innovations and Research. Dedicated research initiatives in these areas are undertaken through establishment of dedicated research centres viz. <strong>Dr. K C Patel Research and Development Centre, CHARUSAT Space Research & Technology Centre, International Centre for Cosmology and Center of Excellence in Artificial Intelligence<\/strong> as well as various sophisticated labs, central instrumentation facilities and NABL-accredited special labs. These initiatives have overall yielded significant impact and deliverables in industry, academic, environment and healthcare sectors.<\/p>\n\n<p class=\"inherit-font-size\">To further accelerate interdisciplinary research activities at CHARUSAT, various initiatives have been taken. As a result, 25+ Patents have been filed and\/or held by the students and faculty members of CHARUSAT. To accelerate applied research activities on campus, Sophisticated Research and Testing Labs have also been established. Distinctively, CHARUSAT has also initiated Post-Doctoral Fellowships, Research Paper Award, Patent and Intellectual Property Policy, Collaborations, and Endowment Chairs, and Seed Grant for Research.<\/p>\n\n<p class=\"inherit-font-size\"><strong>Entrepreneurship Development and Incubation Centre (EDIC)<\/strong> has also been established to address the challenges and explore the opportunities that young aspirants can explore.\u00a0 A non-profit organization called \"<strong>CHARUSAT Innovative Ventures Foundation (CIVF)<\/strong>\" was founded by the university to investigate the commercialization of CHARUSAT's research, innovation, and intellectual property for the benefit of CHARUSAT and society. At CHARUSAT, efforts are also made for education amelioration in rural schools through <strong>CHARUSAT Rural Education Development Program (CREDP)<\/strong>. There also exists <strong>Pri. B I Patel Human Resource Development Centre<\/strong> to hone competencies of Faculty and Staff.<\/p>\n\n<p class=\"inherit-font-size\">Finally, CHARUSAT fosters an aspiration of being a <strong>World Class University<\/strong>. It strives, initially, to be in the league of <strong>Top 20 Universities at National Level<\/strong>. CHARUSAT wishes to achieve it through hybrid culture: A culture representing the serenity of the oldest places of learning like Takshashila and Nalanda and the scholarship of the centers like Harvard and Stanford.<\/p>\n","establish_year":"2000","live_switch":"1","client_offering_type":"1","invitation_mail_title":"","insti_type":"3","communication_switch":"1","sub_sn":"cspit","sub_cid":"220","sub_name":"Chandubhai S Patel Of Institute Technology(Formerly  Known as CITC)","sub_id":"15977","parent_cid":219,"university_username":null,"university_name":null,"faculty_count":"0","replyto_email":"alumni@charusat.ac.in","versioning":{"logo_versioning":1705402934},"onboarding_steps":"100","onboarding_steps_details":{"steps":{"2":{"isCompleted":true},"100":{"isCompleted":true,"time":1597050488},"4":{"isCompleted":true}}},"metadata":null,"agreement_status":"1","logo":"https:\/\/almashines.s3.dualstack.ap-southeast-1.amazonaws.com\/assets\/images\/institutes\/logo\/170x170\/219.jpg","child_institutes":[{"sub_name":"Chandubhai S Patel Of Institute Technology(Formerly  Known as CITC)","sub_cid":"220","sub_id":"15977","sub_sn":"cspit"},{"sub_name":"Devang Patel Institute of Advance Technology and Research","sub_cid":"221","sub_id":"25990","sub_sn":"depstar"},{"sub_name":"Smt. Chandaben Mohanbhai Patel Institute of Computer Applications","sub_cid":"222","sub_id":"25991","sub_sn":"cmpica"},{"sub_name":"Ramanbhai Patel College of Pharmacy","sub_cid":"223","sub_id":"25992","sub_sn":"rpcp"},{"sub_name":"Indukaka Ipcowala Institute of Management","sub_cid":"224","sub_id":"25993","sub_sn":"i2im"},{"sub_name":"P D Patel Institute of Applied Sciences","sub_cid":"225","sub_id":"25994","sub_sn":"pdpias"},{"sub_name":"Ashok & Rita Patel institute of Physiotherapy","sub_cid":"226","sub_id":"25995","sub_sn":"arip"},{"sub_name":"Manikaka Topawala Institute of Nursing","sub_cid":"227","sub_id":"25996","sub_sn":"mtin"},{"sub_name":"Bapubhai Desaibhai Patel Institute of Paramedical Sciences","sub_cid":"1215","sub_id":"98386","sub_sn":"CID1215"}],"is_blueterra":false,"contact_details":{"address":"CHARUSAT Campus, Off. Nadiad-Petlad Highway, Changa - 388421, Anand, Gujarat, INDIA","pho
